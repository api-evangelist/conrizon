aid: conrizon
name: conrizon
description: >-
  conrizon AG is a German holding company, founded in 2020 and headquartered in
  Essen, that unites four of Europe's leading Enterprise Content Management (ECM)
  brands - easy software, PROXESS, HABEL, and Portal Systems (Shareflex),
  alongside the friendWorks professional-services unit - under one roof. The
  group provides legally compliant, audit-proof digital archiving (GDPR, GoBD,
  eIDAS), document management (DMS), invoice and procure-to-pay (P2P) processing,
  contract management, and HR/HCM software with automated workflows, plus AI
  services and connectors for SAP and Microsoft 365 / SharePoint. Solutions are
  offered cloud-native, in a private cloud, on-premises, or hybrid, and are
  relied on by more than 8,700 companies and organizations worldwide. conrizon is
  a portfolio company of Battery Ventures. It publishes a corporate marketing
  site but no public developer API or developer portal.
